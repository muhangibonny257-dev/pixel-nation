<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Nation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: #1c1917;
    color: #f5f5f4;
    min-height: 100vh;
    padding: 12px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 340px; } }
  canvas {
    width: 100%; max-width: 768px;
    border: 4px solid #292524; border-radius: 12px;
    image-rendering: pixelated; display: block;
    aspect-ratio: 1 / 1;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    background: #2a1f14;
  }
  #news {
    background: #292524; border: 2px solid #57534e;
    border-radius: 12px; padding: 12px;
    max-height: 768px; overflow-y: auto;
  }
  #news h2 {
    font-size: 12px; text-transform: uppercase;
    letter-spacing: 2px; color: #a8a29e; margin: 0 0 8px;
  }
  #news ul { list-style: none; padding: 0; margin: 0; }
  .news-item {
    font-size: 12px; padding: 6px 8px;
    border-left: 4px solid #57534e;
    margin-bottom: 6px;
  }
  .news-item.low    { border-color: #57534e; color: #d6d3d1; }
  .news-item.medium { border-color: #d97706; color: #fcd34d; }
  .news-item.high   { border-color: #dc2626; color: #fca5a5; }
  .time { opacity: 0.5; }
</style>
</head>
<body>
  <h1>🏙️ Pixel Nation</h1>
  <div class="grid">
    <canvas id="game"></canvas>
    <aside id="news">
      <h2>📡 World News</h2>
      <ul id="news-list"></ul>
    </aside>
  </div>

<script>
// === CONFIG ===
const TILE = 28, MAP_W = 32, MAP_H = 32, TICK_MS = 100;

// === WORLD MAP ===
function generateMap() {
  const map = [];
  for (let y = 0; y < MAP_H; y++) {
    const row = [];
    for (let x = 0; x < MAP_W; x++) {
      const river = Math.sin(x * 0.3) + Math.cos(y * 0.4);
      let type = 'grass', resource;
      if (river > 1.4) type = 'water';
      else if (Math.random() < 0.10) { type = 'tree'; resource = 10; }
      else if (Math.random() < 0.04) { type = 'rock'; resource = 5; }
      row.push({ type, resource, noise: Math.random() });
    }
    map.push(row);
  }
  return map;
}

// === AGENTS ===
const NAMES = ['Aria', 'Bob', 'Celes', 'Dax', 'Eve', 'Fenn', 'Gale', 'Hugo'];
function createAgent(i) {
  return {
    id: 'agent-' + i,
    name: NAMES[i % NAMES.length],
    pos: { x: 4 + (i * 3) % MAP_W, y: 4 + Math.floor(i / 4) * 3 },
    target: null, state: 'IDLE', stateTimer: 0,
    needs: { hunger: 20, energy: 10, social: 15 },
    inventory: { wood: 0, food: 2, gold: 5 },
    traits: { aggression: Math.random(), sociability: Math.random(), industriousness: Math.random() },
    color: 'hsl(' + (i * 45) + ', 70%, 55%)',
    mood: 70, alive: true,
  };
}

// === NEWS FEED ===
const newsEvents = [];
function pushNews(type, message, severity) {
  newsEvents.unshift({
    id: Math.random().toString(36).slice(2),
    type, message, severity,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
  });
  if (newsEvents.length > 100) newsEvents.pop();
  renderNews();
}
function renderNews() {
  document.getElementById('news-list').innerHTML = newsEvents.map(e =>
    '<li class="news-item ' + e.severity + '"><span class="time">[' + e.time + ']</span> ' + e.message + '</li>'
  ).join('');
}

// === UTILITY AI ===
function scoreActions(agent, world) {
  const actions = [];
  const { hunger, energy, social } = agent.needs;
  if (hunger > 60 && agent.inventory.food > 0) {
    agent.inventory.food--;
    agent.needs.hunger = Math.max(0, hunger - 60);
    return { state: 'RESTING', score: 300 };
  }
  if (energy > 70) actions.push({ state: 'RESTING', score: 150 + energy });

  const tree = findNearest(agent.pos, world.map, t => t.type === 'tree' && (t.resource || 0) > 0);
  if (tree && agent.traits.industriousness > 0.3) {
    actions.push({ state: 'GATHERING', target: tree, score: 80 + agent.traits.industriousness * 80 - energy });
  }

  const other = world.agents.find(o => o.id !== agent.id && o.alive);
  if (other && social > 40) {
    actions.push({ state: 'SOCIALIZING', target: other.id, score: 60 + agent.traits.sociability * 80 });
  }

  actions.push({ state: 'WANDERING', target: randomAdjacent(agent.pos), score: 10 });
  actions.sort((a, b) => b.score - a.score);
  return actions[0];
}

function findNearest(from, map, pred) {
  let best = null, bestD = Infinity;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (!pred(map[y][x])) continue;
    const d = Math.abs(x - from.x) + Math.abs(y - from.y);
    if (d < bestD) { bestD = d; best = { x, y }; }
  }
  return best;
}

function randomAdjacent(p) {
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  const [dx, dy] = dirs[Math.floor(Math.random() * 4)];
  return {
    x: Math.max(0, Math.min(MAP_W - 1, p.x + dx * (1 + Math.floor(Math.random() * 4)))),
    y: Math.max(0, Math.min(MAP_H - 1, p.y + dy * (1 + Math.floor(Math.random() * 4)))),
  };
}

// === SIMULATION ===
function updateAgent(a, world) {
  a.needs.hunger = Math.min(100, a.needs.hunger + 0.1);
  a.needs.energy = Math.min(100, a.needs.energy + 0.08);
  a.needs.social = Math.min(100, a.needs.social + 0.05);

  switch (a.state) {
    case 'IDLE': {
      const best = scoreActions(a, world);
      a.state = best.state;
      a.target = best.target || null;
      break;
    }
    case 'WANDERING':
    case 'MOVING': {
      if (a.target && typeof a.target === 'object') {
        const dx = Math.sign(a.target.x - a.pos.x);
        const dy = Math.sign(a.target.y - a.pos.y);
        a.pos = { x: a.pos.x + dx, y: a.pos.y + dy };
        if (a.pos.x === a.target.x && a.pos.y === a.target.y) {
          a.state = 'IDLE'; a.target = null;
        }
      } else a.state = 'IDLE';
      break;
    }
    case 'GATHERING': {
      if (++a.stateTimer >= 30) {
        const t = world.map[a.pos.y] && world.map[a.pos.y][a.pos.x];
        if (t && t.type === 'tree' && (t.resource || 0) > 0) {
          a.inventory.wood++; t.resource--;
        }
        a.state = 'IDLE'; a.stateTimer = 0;
      }
      break;
    }
    case 'RESTING': {
      a.needs.energy = Math.max(0, a.needs.energy - 0.6);
      if (++a.stateTimer >= 100) { a.state = 'IDLE'; a.stateTimer = 0; }
      break;
    }
    case 'SOCIALIZING': {
      a.needs.social = Math.max(0, a.needs.social - 0.6);
      if (++a.stateTimer >= 40) {
        if (Math.random() < 0.25) {
          const other = world.agents.find(o => o.id === a.target);
          if (other) generateDrama(a, other);
        }
        a.state = 'IDLE'; a.stateTimer = 0;
      }
      break;
    }
  }

  a.mood = Math.round(100 - (a.needs.hunger + a.needs.energy + a.needs.social) / 3);
  if (a.needs.hunger >= 100) {
    a.alive = false;
    pushNews('death', a.name + ' starved to death.', 'high');
  }
}

// === DRAMA ===
const DRAMA_TEMPLATES = [
  (a, b) => a.name + ' traded ' + Math.ceil(Math.random()*5) + ' wood to ' + b.name + ' for a shiny rock.',
  (a, b) => a.name + ' accused ' + b.name + ' of stealing a fish. Tension rises.',
  (a, b) => a.name + ' and ' + b.name + ' formed a secret alliance.',
  (a, b) => a.name + ' and ' + b.name + ' argued loudly about the price of wood.',
  (a, b) => a.name + ' gave ' + b.name + ' a warm hug. Moods up.',
  (a, b) => a.name + ' challenged ' + b.name + ' to a staring contest.',
  (a, b) => a.name + ' whispered a rumor about ' + b.name + '.',
  (a, b) => a.name + ' shared food with ' + b.name + '. Kindness in the pixel wild.',
];
function generateDrama(a, b) {
  const tpl = DRAMA_TEMPLATES[Math.floor(Math.random() * DRAMA_TEMPLATES.length)];
  pushNews('chat', tpl(a, b), 'medium');
}

// === RENDER ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = MAP_W * TILE;
canvas.height = MAP_H * TILE;

const EMOTES = {
  IDLE: '', WANDERING: '?', MOVING: '→', GATHERING: '⛏',
  BUILDING: '🔨', RESTING: '💤', SOCIALIZING: '💬',
};

// draw a single tile with pixel-art detail
function drawTile(t, px, py, time) {
  if (t.type === 'grass') {
    ctx.fillStyle = '#4a7c3a';
    ctx.fillRect(px, py, TILE, TILE);
    // deterministic grass texture
    const n = t.noise;
    ctx.fillStyle = '#3d6630';
    ctx.fillRect(px + 4 + n*14, py + 6 + n*10, 2, 2);
    ctx.fillRect(px + 14 + n*6, py + 16 - n*4, 2, 2);
    ctx.fillStyle = '#5a8c46';
    ctx.fillRect(px + 8 + n*10, py + 20 - n*8, 2, 2);
  } else if (t.type === 'water') {
    ctx.fillStyle = '#2a5c8a';
    ctx.fillRect(px, py, TILE, TILE);
    // animated waves
    ctx.strokeStyle = '#4a7caf';
    ctx.lineWidth = 1.5;
    const off = Math.sin(time * 0.002 + t.noise * 6) * 2;
    ctx.beginPath();
    ctx.moveTo(px + 4, py + 9 + off);
    ctx.lineTo(px + 12, py + 9 + off);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + 10, py + 19 - off);
    ctx.lineTo(px + 22, py + 19 - off);
    ctx.stroke();
    // sparkle
    ctx.fillStyle = '#a8d4f0';
    ctx.fillRect(px + 16 + (t.noise*6), py + 4 + (t.noise*4), 1, 1);
  } else if (t.type === 'tree') {
    // grass base under the tree
    ctx.fillStyle = '#4a7c3a';
    ctx.fillRect(px, py, TILE, TILE);
    // trunk
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(px + TILE/2 - 2, py + TILE - 10, 4, 8);
    ctx.fillStyle = '#3a2a0a';
    ctx.fillRect(px + TILE/2 - 2, py + TILE - 4, 4, 2);
    // shadow under foliage
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(px + TILE/2, py + TILE - 8, 10, 3, 0, 0, Math.PI*2);
    ctx.fill();
    // foliage layers
    ctx.fillStyle = '#1f4a1f';
    ctx.beginPath();
    ctx.arc(px + TILE/2, py + TILE/2 - 2, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2d6b2d';
    ctx.beginPath();
    ctx.arc(px + TILE/2 - 3, py + TILE/2 - 5, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#3d8a3d';
    ctx.beginPath();
    ctx.arc(px + TILE/2 - 4, py + TILE/2 - 7, 4, 0, Math.PI*2);
    ctx.fill();
    // resource indicator
    if (t.resource <= 3) {
      ctx.fillStyle = '#6a4a2a';
      ctx.beginPath();
      ctx.arc(px + TILE/2 + 5, py + TILE/2 + 3, 2, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (t.type === 'rock') {
    // grass base
    ctx.fillStyle = '#4a7c3a';
    ctx.fillRect(px, py, TILE, TILE);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(px + TILE/2, py + TILE - 8, 9, 3, 0, 0, Math.PI*2);
    ctx.fill();
    // rock body
    ctx.fillStyle = '#6b6b6b';
    ctx.beginPath();
    ctx.moveTo(px + 6, py + TILE - 8);
    ctx.lineTo(px + 8, py + 10);
    ctx.lineTo(px + TILE/2 + 2, py + 6);
    ctx.lineTo(px + TILE - 6, py + 12);
    ctx.lineTo(px + TILE - 5, py + TILE - 8);
    ctx.closePath();
    ctx.fill();
    // highlight
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath();
    ctx.moveTo(px + 10, py + 12);
    ctx.lineTo(px + TILE/2 + 1, py + 9);
    ctx.lineTo(px + TILE/2 + 3, py + 15);
    ctx.lineTo(px + 12, py + 18);
    ctx.closePath();
    ctx.fill();
  }
}

// draw an agent as a little pixel person
function drawAgent(a, time) {
  const px = a.pos.x * TILE + TILE / 2;
  const py = a.pos.y * TILE + TILE / 2;
  const bob = Math.sin(time * 0.006 + a.pos.x + a.pos.y) * 1.5;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py + 10, 8, 3, 0, 0, Math.PI*2);
  ctx.fill();

  const y = py + bob;

  // legs
  ctx.fillStyle = '#2a1a1a';
  ctx.fillRect(px - 4, y + 4, 3, 6);
  ctx.fillRect(px + 1, y + 4, 3, 6);

  // body (shirt = agent color)
  ctx.fillStyle = a.color;
  ctx.fillRect(px - 5, y - 2, 10, 8);
  // body shading
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(px + 3, y - 2, 2, 8);

  // arms
  ctx.fillStyle = '#e8b890';
  ctx.fillRect(px - 7, y, 2, 5);
  ctx.fillRect(px + 5, y, 2, 5);

  // head (skin)
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath();
  ctx.arc(px, y - 7, 4.5, 0, Math.PI*2);
  ctx.fill();
  // hair
  ctx.fillStyle = a.color;
  ctx.beginPath();
  ctx.arc(px, y - 9, 4.5, Math.PI, Math.PI*2);
  ctx.fill();

  // eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(px - 2, y - 7, 1, 1);
  ctx.fillRect(px + 1, y - 7, 1, 1);

  // name tag
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  const tw = ctx.measureText(a.name).width;
  ctx.fillRect(px - tw/2 - 2, y - 22, tw + 4, 10);
  ctx.fillStyle = '#fff';
  ctx.fillText(a.name, px, y - 14);

  // emote
  const emote = EMOTES[a.state];
  if (emote) {
    ctx.font = '11px monospace';
    ctx.fillText(emote, px, y - 26);
  }
}

function render(world, time) {
  ctx.fillStyle = '#2a1f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // tiles
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    drawTile(world.map[y][x], x * TILE, y * TILE, time);
  }

  // agents sorted by y (so lower agents draw in front)
  const sorted = world.agents.filter(a => a.alive).sort((a, b) => a.pos.y - b.pos.y);
  for (const a of sorted) drawAgent(a, time);
}

// === MAIN LOOP ===
const world = {
  tick: 0,
  map: generateMap(),
  agents: Array.from({ length: 6 }, (_, i) => createAgent(i)),
};

let lastTick = 0;
function loop(t) {
  if (t - lastTick >= TICK_MS) {
    world.tick++;
    for (const a of world.agents) if (a.alive) updateAgent(a, world);
    lastTick = t;
  }
  render(world, t);
  requestAnimationFrame(loop);
}

pushNews('discovery', 'A new civilization awakens...', 'low');
requestAnimationFrame(loop);
</script>
</body>
</html>
